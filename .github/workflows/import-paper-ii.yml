name: Import Paper II Full Notes
on:
  push:
    branches: [main]
    paths:
      - incoming/TGPSC_PAPER_II_15_TOPICS_REVISED_DRAFT.zip
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-ii-import
  cancel-in-progress: false
jobs:
  import-paper-ii:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chapter rendering dependency
        run: python -m pip install 'mistune>=3,<4'
      - name: Validate ZIP and generate all 15 chapters
        run: python scripts/import_paper_ii.py
      - name: Commit HTML notes and PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Paper 2' 'PAPER-II-IMPORT-REPORT.json'
          if git diff --cached --quiet; then
            echo 'Already up to date.'
          else
            git commit -m 'Import all 15 Paper II full notes, PDFs, and source Markdown'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Package TGPSC Published Site
on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tgpsc-publication-snapshot
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub-published source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Create integrity-checked publication ZIP
        run: python3 scripts/package_publication.py
      - name: Preserve ZIP as downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgpsc-github-publication-snapshot
          path: downloads/TGPSC_GITHUB_PUBLICATION_SNAPSHOT.zip
          if-no-files-found: error
          retention-days: 90
      - name: Commit download to website and repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- downloads/TGPSC_GITHUB_PUBLICATION_SNAPSHOT.zip
          if git diff --cached --quiet; then
            echo 'Download is already up to date.'
          else
            git commit -m 'Update ZIP of published TGPSC website sources'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Render Topic 2-3-2 Integrated Edition
on:
  push:
    branches: [main]
    paths:
      - 'Paper 2/Unit 3 - Geography of India and Telangana/Topic 2/source/integrated-student-edition-2026-10-26.md'
      - 'scripts/render_topic_2_3_2.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tgpsc-topic-2-3-2-integrated-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF rendering dependencies
        run: |
          python -m pip install 'reportlab>=4,<5' 'markdown-it-py>=3,<5' 'pymupdf>=1.24,<2'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
      - name: Render, verify original preservation and publish integrated PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          chapter='Paper 2/Unit 3 - Geography of India and Telangana/Topic 2'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            test "$(sha256sum "$chapter/complete-notes.pdf" | cut -d' ' -f1)" = 'ca52cb6b999bfce51d07782a5bc3ab9df9b54396de63e54bee1a317837f69886'
            python scripts/render_topic_2_3_2.py \
              --input "$chapter/source/integrated-student-edition-2026-10-26.md" \
              --output "$chapter/source/integrated-student-edition-2026-10-26.pdf" \
              --qa 'project-control/academic-readiness/2-3-2-render-qa.json'
            python - <<'PY'
          import fitz
          p='Paper 2/Unit 3 - Geography of India and Telangana/Topic 2/source/integrated-student-edition-2026-10-26.pdf'
          doc=fitz.open(p)
          assert len(doc)>=10, len(doc)
          assert all(len(page.get_text().strip())>60 for page in doc)
          print('Rendered integrated PDF pages:',len(doc))
          PY
            git add -- "$chapter/source/integrated-student-edition-2026-10-26.pdf" 'project-control/academic-readiness/2-3-2-render-qa.json'
            if git diff --cached --quiet; then
              echo 'PDF and QA are already synchronized.'
              exit 0
            fi
            git commit -m 'Synchronize Topic 2-3-2 integrated PDF with consolidated geography Markdown'
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected; retrying from fresh main (attempt $attempt)."
          done
          echo '::error::Unable to publish integrated PDF after 3 guarded retries.'
          exit 1
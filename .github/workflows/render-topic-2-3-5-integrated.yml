name: Render Topic 2-3-5 Integrated Edition
on:
  push:
    branches: [main]
    paths:
      - 'Paper 2/Unit 3 - Geography of India and Telangana/Topic 5/source/integrated-student-edition-2026-10-27.md'
      - '.github/workflows/render-topic-2-3-5-integrated.yml'
      - 'scripts/render_topic_2_3_4.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tgpsc-topic-2-3-5-integrated-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'reportlab>=4,<5' 'markdown-it-py>=3,<5' 'pymupdf>=1.24,<2'
      - name: Guarded render and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          chapter='Paper 2/Unit 3 - Geography of India and Telangana/Topic 5'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            test "$(sha256sum "$chapter/complete-notes.pdf" | cut -d' ' -f1)" = 'a842add222d65564077c1451a86a6e8d2c001d88aa6c2866f320a1bb5212ea18'
            python - <<'PY'
          import json, pathlib
          a=json.loads(pathlib.Path('project-control/ACADEMIC_READINESS_75_TOPIC_STATUS_INDEX.json').read_text())
          b=json.loads(pathlib.Path('project-control/PRODUCTION-CHECKPOINT.json').read_text())
          assert a['total_topics']==75 and b['total_topics']==75 and len(b['topics'])==75
          files=list(pathlib.Path('project-control/academic-readiness').glob('[2-6]-[1-3]-[1-5].json'))
          assert len(files)==75, len(files)
          PY
            python scripts/render_topic_2_3_4.py \
              --input "$chapter/source/integrated-student-edition-2026-10-27.md" \
              --output "$chapter/source/integrated-student-edition-2026-10-27.pdf" \
              --qa 'project-control/academic-readiness/2-3-5-render-qa.json'
            python - <<'PY'
          import fitz
          p='Paper 2/Unit 3 - Geography of India and Telangana/Topic 5/source/integrated-student-edition-2026-10-27.pdf'
          doc=fitz.open(p)
          assert len(doc)>=15,len(doc)
          assert all(len(page.get_text().strip())>60 for page in doc)
          print('Rendered Topic2-3-5 pages:',len(doc))
          PY
            git add -- "$chapter/source/integrated-student-edition-2026-10-27.pdf" 'project-control/academic-readiness/2-3-5-render-qa.json'
            if git diff --cached --quiet; then echo 'PDF already synchronized'; exit 0; fi
            git commit -m 'Synchronize Topic 2-3-5 integrated PDF from editable master'
            if git push origin HEAD:main; then exit 0; fi
            echo "Retry guarded render from latest main: $attempt"
          done
          exit 1

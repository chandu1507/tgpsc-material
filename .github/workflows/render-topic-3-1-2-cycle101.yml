name: Render Topic 3-1-2 Cycle101 Integrated Edition
on:
  push:
    branches: [main]
    paths:
      - 'Paper 3/Unit 1 - Indian Society/Topic 2/source/integrated-student-edition-2026-10-30.md'
      - 'scripts/render_topic_3_1_2_cycle101.py'
      - '.github/workflows/render-topic-3-1-2-cycle101.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tgpsc-topic-3-1-2-cycle101-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic renderer dependencies
        run: python -m pip install 'reportlab>=4,<5' 'markdown-it-py>=3,<5' 'pymupdf>=1.24,<2'
      - name: Guarded render and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          chapter='Paper 3/Unit 1 - Indian Society/Topic 2'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            test "$(sha256sum "$chapter/complete-notes.pdf" | cut -d' ' -f1)" = '9d376a4784e8d040e41985788ddae677fa95363d816ec6a4694a4f9439360921'
            python - <<'PY'
          import json, pathlib, re
          checkpoint=json.loads(pathlib.Path('project-control/PRODUCTION-CHECKPOINT.json').read_text())
          index=json.loads(pathlib.Path('project-control/ACADEMIC_READINESS_75_TOPIC_STATUS_INDEX.json').read_text())
          assert checkpoint['total_topics']==75 and len(checkpoint['topics'])==75
          assert index['total_topics']==75 and len(index['paths'])==75
          records=list(pathlib.Path('project-control/academic-readiness').glob('[2-6]-[1-3]-[1-5].json'))
          assert len(records)==75,len(records)
          master=pathlib.Path('Paper 3/Unit 1 - Indian Society/Topic 2/source/integrated-student-edition-2026-10-30.md').read_text()
          part=master.split('# Part E — Original four-option MCQs')[1].split('# Part F — Six original mains')[0]
          assert len(re.findall(r'^\d+\. \*\*',part,re.M))==25
          assert len(re.findall(r'^## Model Answer \d+ —',master,re.M))==6
          assert 'NOT INDEPENDENTLY APPROVED' in master
          PY
            python scripts/render_topic_3_1_2_cycle101.py \
              --input "$chapter/source/integrated-student-edition-2026-10-30.md" \
              --output "$chapter/source/integrated-student-edition-2026-10-30.pdf" \
              --qa 'project-control/academic-readiness/3-1-2-cycle101-render-qa.json'
            python - <<'PY'
          import fitz, json
          p='Paper 3/Unit 1 - Indian Society/Topic 2/source/integrated-student-edition-2026-10-30.pdf'
          d=fitz.open(p)
          q=json.load(open('project-control/academic-readiness/3-1-2-cycle101-render-qa.json'))
          assert len(d)>=23,len(d)
          assert q['concept_start_count']==23,q['concept_start_count']
          assert all(len(page.get_text().strip())>=50 for page in d),[i+1 for i,p in enumerate(d) if len(p.get_text().strip())<50]
          assert 'Social Exclusion' in d[0].get_text()
          print('Topic 3-1-2 pages:',len(d))
          PY
            git add -- "$chapter/source/integrated-student-edition-2026-10-30.pdf" 'project-control/academic-readiness/3-1-2-cycle101-render-qa.json'
            if git diff --cached --quiet; then echo 'PDF already synchronized'; exit 0; fi
            git commit -m 'Render Topic 3-1-2 Cycle101 PDF from coherent editable master'
            if git push origin HEAD:main; then exit 0; fi
            echo "Retry guarded nonforce publish after concurrent main update: $attempt"
          done
          exit 1

name: Render Topic 3-1-3 Cycle103 Integrated Edition
on:
  push:
    branches: [main]
    paths:
      - 'Paper 3/Unit 1 - Indian Society/Topic 3/source/integrated-student-edition-2026-10-30.md'
      - 'scripts/render_topic_3_1_3_cycle103.py'
      - '.github/workflows/render-topic-3-1-3-cycle103.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tgpsc-topic-3-1-3-cycle103-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned-major renderer dependencies
        run: python -m pip install 'reportlab>=4,<5' 'markdown-it-py>=3,<5' 'pymupdf>=1.24,<2'
      - name: Guarded nonforce render and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          chapter='Paper 3/Unit 1 - Indian Society/Topic 3'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            test "$(sha256sum "$chapter/complete-notes.pdf" | cut -d' ' -f1)" = '4232d13cc97da86bafcef526f7a3f86b951c96444b569dae00e8f444e0a0a5ef'
            python - <<'PY'
          import json,pathlib,re
          c=json.loads(pathlib.Path('project-control/PRODUCTION-CHECKPOINT.json').read_text())
          i=json.loads(pathlib.Path('project-control/ACADEMIC_READINESS_75_TOPIC_STATUS_INDEX.json').read_text())
          assert c['total_topics']==75 and len(c['topics'])==75
          assert i['total_topics']==75 and len(i['paths'])==75
          assert len(list(pathlib.Path('project-control/academic-readiness').glob('[2-6]-[1-3]-[1-5].json')))==75
          s=pathlib.Path('Paper 3/Unit 1 - Indian Society/Topic 3/source/integrated-student-edition-2026-10-30.md').read_text()
          concepts=s.split('# Part C —')[1].split('# Part D —')[0]
          mcqs=s.split('# Part E —')[1].split('# Part F —')[0]
          mains=s.split('# Part F —')[1].split('# Part G —')[0]
          assert [int(x) for x in re.findall(r'^## (\d+)\. ',concepts,re.M)]==list(range(1,21))
          assert sorted(int(x) for x in re.findall(r'^\*\*(\d+)\. ',mcqs,re.M))==list(range(1,31))
          assert [int(x) for x in re.findall(r'^## Question (\d+)\.',mains,re.M)]==list(range(1,9))
          assert 'NOT INDEPENDENTLY APPROVED' in s
          PY
            python scripts/render_topic_3_1_3_cycle103.py --input "$chapter/source/integrated-student-edition-2026-10-30.md" --output "$chapter/source/integrated-student-edition-2026-10-30.pdf" --qa 'project-control/academic-readiness/3-1-3-cycle103-render-qa.json'
            python - <<'PY'
          import json,fitz
          p='Paper 3/Unit 1 - Indian Society/Topic 3/source/integrated-student-edition-2026-10-30.pdf'
          d=fitz.open(p);q=json.load(open('project-control/academic-readiness/3-1-3-cycle103-render-qa.json'))
          assert q['concept_start_count']==20,q['concept_start_count']
          assert len(d)>=20,len(d)
          assert all(len(x.get_text().strip())>=50 for x in d),[j+1 for j,x in enumerate(d) if len(x.get_text().strip())<50]
          print('Topic 3-1-3 synchronized pages:',len(d))
          PY
            git add -- "$chapter/source/integrated-student-edition-2026-10-30.pdf" project-control/academic-readiness/3-1-3-cycle103-render-qa.json
            if git diff --cached --quiet; then echo 'Already synchronized'; exit 0; fi
            git commit -m 'Render Topic 3-1-3 Cycle103 synchronized integrated PDF'
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent main advanced; retry guarded nonforce render $attempt"
          done
          exit 1

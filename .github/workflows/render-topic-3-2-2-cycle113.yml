name: Render Topic 3-2-2 Cycle113 Integrated Edition
on:
  push:
    branches: [main]
    paths:
      - 'Paper 3/Unit 2 - Constitution of India/Topic 2/source/integrated-student-edition-2026-10-30.md'
      - 'Paper 3/Unit 2 - Constitution of India/Topic 2/source/article20-three-clause-decision-tree.svg'
      - 'scripts/render_topic_3_2_2_cycle113.py'
      - '.github/workflows/render-topic-3-2-2-cycle113.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tgpsc-topic-3-2-2-cycle113-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev pkg-config libffi-dev
          python -m pip install 'reportlab>=4,<5' 'markdown-it-py>=3,<5' 'svglib>=1.5,<2' 'pymupdf>=1.24,<2'
      - name: Guarded nonforce PDF build and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          chapter='Paper 3/Unit 2 - Constitution of India/Topic 2'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            test "$(sha256sum "$chapter/complete-notes.pdf" | cut -d' ' -f1)" = 'a67f6ee14968b79ae5726a023d8c047807c97aaaa42d284c40b23503c796590d'
            test "$(sha256sum "$chapter/source/integrated-student-edition-2026-10-27.pdf" | cut -d' ' -f1)" = '1284823e775af77d87663cbdc52d7e130f919c4a2bff78c3342f517477e76831'
            python -c "import json,pathlib; c=json.loads(pathlib.Path('project-control/PRODUCTION-CHECKPOINT.json').read_text()); i=json.loads(pathlib.Path('project-control/ACADEMIC_READINESS_75_TOPIC_STATUS_INDEX.json').read_text()); assert c['total_topics']==75 and len(c['topics'])==75; assert i['total_topics']==75 and len(i['paths'])==75; assert len(list(pathlib.Path('project-control/academic-readiness').glob('[2-6]-[1-3]-[1-5].json')))==75"
            python scripts/render_topic_3_2_2_cycle113.py --input "$chapter/source/integrated-student-edition-2026-10-30.md" --output "$chapter/source/integrated-student-edition-2026-10-30.pdf" --qa project-control/academic-readiness/3-2-2-cycle113-render-qa.json
            python -c "import fitz,re,pathlib; s=pathlib.Path('Paper 3/Unit 2 - Constitution of India/Topic 2/source/integrated-student-edition-2026-10-30.md').read_text(); d=fitz.open('Paper 3/Unit 2 - Constitution of India/Topic 2/source/integrated-student-edition-2026-10-30.pdf'); assert len(d)>=25; assert len(re.findall(r'^\*\*Q\d+\.',s,re.M))==30; assert len(re.findall(r'^\*\*Answer: [A-D]\.',s,re.M))==30; assert len(re.findall(r'^### Mains Q\d+\.',s,re.M))==6; assert all(len(p.get_text().strip())>=100 for p in d); assert sum(len(p.get_drawings()) for p in d)>=20; assert all(all(b[0]>=0 and b[1]>=0 and b[2]<=p.rect.width and b[3]<=p.rect.height for b in p.get_text('blocks')) for p in d); print('Verified integrated pages:',len(d))"
            git add -- "$chapter/source/integrated-student-edition-2026-10-30.pdf" project-control/academic-readiness/3-2-2-cycle113-render-qa.json
            if git diff --cached --quiet; then echo 'PDF already synchronized'; exit 0; fi
            git commit -m 'Render Topic 3-2-2 Cycle113 synchronized integrated PDF'
            if git push origin HEAD:main; then exit 0; fi
            echo "Fresh main advanced; retry guarded nonforce render $attempt"
          done
          exit 1

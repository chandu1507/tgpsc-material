name: Render Topic 3-2-3 Integrated Edition
on:
  push:
    branches: [main]
    paths:
      - 'Paper 3/Unit 2 - Constitution of India/Topic 3/source/complete-notes.md'
      - 'Paper 3/Unit 2 - Constitution of India/Topic 3/source/council-floor-versus-ministry-ceiling.svg'
      - 'Paper 3/Unit 2 - Constitution of India/Topic 3/source/state-ordinary-bill-article197.svg'
      - '.github/workflows/render-topic-3-2-3-integrated.yml'
      - 'scripts/render_topic_3_2_3.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tgpsc-topic-3-2-3-integrated-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev pkg-config libffi-dev
          python -m pip install 'reportlab>=4,<5' 'markdown-it-py>=3,<5' 'svglib>=1.5,<2' 'pymupdf>=1.24,<2'
      - name: Guarded render, manifest synchronization and publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          chapter='Paper 3/Unit 2 - Constitution of India/Topic 3'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            test "$(sha256sum "$chapter/complete-notes.pdf" | cut -d' ' -f1)" = 'f4595c00760b0659f1cf4cb846404aa24eb4ab7944223731c498f9aa377dac24'
            python - <<'PY'
          import pathlib,json
          root=pathlib.Path('project-control/academic-readiness')
          index=json.loads(pathlib.Path('project-control/ACADEMIC_READINESS_75_TOPIC_STATUS_INDEX.json').read_text())
          checkpoint=json.loads(pathlib.Path('project-control/PRODUCTION-CHECKPOINT.json').read_text())
          assert index['total_topics']==75 and checkpoint['total_topics']==75 and len(checkpoint['topics'])==75
          assert len(list(root.glob('[2-6]-[1-3]-[1-5].json')))==75
          statuses={t['id']:t['readiness_status'] for t in checkpoint['topics']}
          assert len(statuses)==75, 'duplicate or missing topic ids'
          assert set(statuses)=={p.rsplit('/',1)[-1][:-5] for p in index['paths']}
          assert set(index['pilot_in_progress'])=={k for k,v in statuses.items() if v=='IN_PROGRESS'}
          assert set(index['assessed_rebuild_required'])=={k for k,v in statuses.items() if v=='ASSESSED_REBUILD_REQUIRED'}
          assert all(v in ('IN_PROGRESS','ASSESSED_REBUILD_REQUIRED','NOT_ASSESSED') for v in statuses.values())
          assert index['not_assessed_count']==sum(v=='NOT_ASSESSED' for v in statuses.values())
          assert index['independently_academically_approved_count']==0
          assert checkpoint['academically_approved']==0
          import re
          chapter=pathlib.Path('Paper 3/Unit 2 - Constitution of India/Topic 3/source')
          for name in ('complete-notes.md','original-mcqs.md'):
            s=(chapter/name).read_text()
            questions=list(re.finditer(r'(?m)^### Q([0-9]+)[.]',s))
            assert [int(x.group(1)) for x in questions]==list(range(1,31)),(name,len(questions))
            for i,m in enumerate(questions):
              block=s[m.start():(questions[i+1].start() if i+1<len(questions) else len(s))]
              if name=='complete-notes.md' and i==29:
                block=block.split('---',1)[0]
              labels=re.findall(r'(?m)^([ABCD])[.] ',block)
              keys=re.findall(r'[*][*]Answer: ([ABCD])[.]',block)
              assert labels==['A','B','C','D'] and len(keys)==1,(name,i+1,labels,keys)
          assert len(re.findall(r'(?m)^## Mains [1-6][.]',(chapter/'complete-notes.md').read_text()))==6
          PY
            python scripts/render_topic_3_2_3.py \
              --input "$chapter/source/complete-notes.md" \
              --output "$chapter/source/integrated-student-edition-2026-10-27.pdf" \
              --qa 'project-control/academic-readiness/3-2-3-render-qa.json'
            python - <<'PY'
          import json, pathlib, hashlib, fitz
          root=pathlib.Path('Paper 3/Unit 2 - Constitution of India/Topic 3')
          pdf=root/'source/integrated-student-edition-2026-10-27.pdf'
          doc=fitz.open(pdf)
          assert len(doc)>=20,len(doc)
          assert all(len(page.get_text().strip())>60 for page in doc)
          assert 'System of Government' in doc[0].get_text()
          paths=['complete-notes.pdf','index.html','source/complete-notes.md','source/detailed-notes.md','source/mains-model-answers.md','source/original-mcqs.md','source/quick-revision.md','source/sources-and-audit.md','source/syllabus-and-summary.md','source/council-floor-versus-ministry-ceiling.svg','source/state-ordinary-bill-article197.svg','source/integrated-student-edition-2026-10-27.pdf']
          p=root/'manifest.json'; m=json.loads(p.read_text())
          m['included_files']=[{'path':s,'bytes':(root/s).stat().st_size,'sha256':hashlib.sha256((root/s).read_bytes()).hexdigest()} for s in paths]
          m['publication_state']='synchronized integrated PDF from canonical editable master; academic audit incomplete'
          m['status']='ASSESSED_REBUILD_REQUIRED; not academically approved'
          m['academically_approved']=0
          m['markdown_words']=len((root/'source/complete-notes.md').read_text().split())
          m['sources_primary_and_secondary']=12
          p.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          print('Rendered',len(doc),'pages; manifest',len(paths),'entries')
          PY
            git add -- "$chapter/source/integrated-student-edition-2026-10-27.pdf" "$chapter/manifest.json" 'project-control/academic-readiness/3-2-3-render-qa.json'
            if git diff --cached --quiet; then echo 'Integrated PDF and manifest already synchronized'; exit 0; fi
            git commit -m 'Synchronize Topic 3-2-3 integrated PDF and manifest from canonical Markdown'
            if git push origin HEAD:main; then exit 0; fi
            echo "Nonforce push raced main; retry fresh render: $attempt"
          done
          exit 1

name: Render Topic 3-3-2 Cycle118 Integrated Student Edition
on:
  push:
    branches: [main]
    paths:
      - 'Paper 3/Unit 3 - Governance/Topic 2/source/detailed-notes.md'
      - 'Paper 3/Unit 3 - Governance/Topic 2/source/original-mcqs.md'
      - 'Paper 3/Unit 3 - Governance/Topic 2/source/sources-and-audit.md'
      - 'Paper 3/Unit 3 - Governance/Topic 2/source/build_topic.py'
      - '.github/workflows/render-topic-3-3-2-integrated.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tgpsc-topic-3-3-2-integrated-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering and QA dependencies
        run: python -m pip install 'reportlab>=4,<5' 'mistune>=3,<4' 'pillow>=10,<13' 'pymupdf>=1.24,<2'
      - name: Guarded render, preserve 75 originals and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json,pathlib,hashlib,re
          cp=json.loads(pathlib.Path('project-control/PRODUCTION-CHECKPOINT.json').read_text())
          ix=json.loads(pathlib.Path('project-control/ACADEMIC_READINESS_75_TOPIC_STATUS_INDEX.json').read_text())
          assert cp['total_topics']==ix['total_topics']==75 and len(cp['topics'])==75
          assert len(list(pathlib.Path('project-control/academic-readiness').glob('[2-6]-[1-3]-[1-5].json')))==75
          ids=[t['id'] for t in cp['topics']]
          assert len(set(ids))==75
          assert set(ids)=={f"{p}-{u}-{t}" for p in range(2,7) for u in range(1,4) for t in range(1,6)}
          assert set(t['id'] for t in cp['topics'] if t['readiness_status']=='IN_PROGRESS')==set(ix['pilot_in_progress'])
          assert set(t['id'] for t in cp['topics'] if t['readiness_status']=='ASSESSED_REBUILD_REQUIRED')==set(ix['assessed_rebuild_required'])
          assert sum(t['readiness_status']=='NOT_ASSESSED' for t in cp['topics'])==ix['not_assessed_count']
          assert len(ix['paths'])==75 and len(set(ix['paths']))==75
          for t in cp['topics']:
              assert (pathlib.Path(t['path'])/'complete-notes.pdf').is_file(),t['id']
          root=pathlib.Path('Paper 3/Unit 3 - Governance/Topic 2')
          assert hashlib.sha256((root/'complete-notes.pdf').read_bytes()).hexdigest()=='93d0838f191cfc88cdce8838ee2e1f6d1bbaec4739c8f46f0428928230a3aa24'
          mcq=(root/'source/original-mcqs.md').read_text()
          assert len(re.findall(r'(?m)^### Q\d+\.',mcq))==30
          assert len(re.findall(r'(?m)^\*\*Answer: [A-D]\. Explanation:',mcq))==30
          assert {letter:len(re.findall(r'(?m)^\*\*Answer: '+letter+r'\. Explanation:',mcq)) for letter in 'ABCD'}=={'A':8,'B':7,'C':8,'D':7}
          PY
            python 'Paper 3/Unit 3 - Governance/Topic 2/source/build_topic.py'
            python - <<'PY'
          import fitz,pathlib,hashlib,json
          root=pathlib.Path('Paper 3/Unit 3 - Governance/Topic 2')
          pdf=root/'source/integrated-student-edition-2026-10-31.pdf'
          doc=fitz.open(pdf)
          assert len(doc)>=30
          assert all(len(p.get_text().strip())>60 for p in doc)
          assert 'Governance at State and District Levels' in doc[0].get_text()
          assert 'Article 243ZA' in ''.join(p.get_text() for p in doc)
          for i,p in enumerate(doc):
              for b in p.get_text('dict')['blocks']:
                  if b['type']==0:
                      x0,y0,x1,y1=b['bbox']
                      assert x0>=20 and y0>=0 and x1<=p.rect.width-15 and y1<=p.rect.height-8,(i+1,b['bbox'])
          assert hashlib.sha256((root/'complete-notes.pdf').read_bytes()).hexdigest()=='93d0838f191cfc88cdce8838ee2e1f6d1bbaec4739c8f46f0428928230a3aa24'
          assert 'source/integrated-student-edition-2026-10-31.pdf' in (root/'index.html').read_text()
          m=json.loads((root/'manifest.json').read_text())
          assert m['original_mcqs']==30 and m['mains_model_answers']==6
          assert m['academic_approvals']==0
          for rel,entry in m['files'].items():
              f=root/rel
              assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==entry['sha256'],('manifest mismatch',rel)
          qa={'topic_id':'3-3-2','pdf_pages':len(doc),'pdf_sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),'legacy_pdf_sha256':'93d0838f191cfc88cdce8838ee2e1f6d1bbaec4739c8f46f0428928230a3aa24','text_boundaries_pass':True,'blank_pages':0,'academic_approved':False,'browser_accessibility_verified':False}
          out=pathlib.Path('project-control/academic-readiness/3-3-2-cycle118-render-qa.json')
          out.write_text(json.dumps(qa,indent=2)+'\n')
          PY
            git add -- 'Paper 3/Unit 3 - Governance/Topic 2/source/complete-notes.md' 'Paper 3/Unit 3 - Governance/Topic 2/source/integrated-student-edition-2026-10-31.pdf' 'Paper 3/Unit 3 - Governance/Topic 2/index.html' 'Paper 3/Unit 3 - Governance/Topic 2/manifest.json' 'Paper 3/Unit 3 - Governance/Topic 2/README.md' project-control/academic-readiness/3-3-2-cycle118-render-qa.json
            if git diff --cached --quiet; then echo 'Already synchronized'; exit 0; fi
            git commit -m 'Render Topic 3-3-2 synchronized integrated edition without altering original PDF'
            if git push origin HEAD:main; then exit 0; fi
            echo "Nonforce push raced main; retry $attempt"
          done
          exit 1

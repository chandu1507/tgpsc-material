name: Render Topic 3-3-5 Integrated Student Edition
on:
  push:
    branches: [main]
    paths:
      - 'Paper 3/Unit 3 - Governance/Topic 5/source/**'
      - 'Paper 3/Unit 3 - Governance/Topic 5/README.md'
      - '.github/workflows/render-topic-3-3-5-integrated.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tgpsc-topic-3-3-5-integrated
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering and QA dependencies
        run: python -m pip install 'reportlab>=4,<5' 'mistune>=3,<4' 'pillow>=10,<13' 'beautifulsoup4>=4,<5' 'pymupdf>=1.24,<2'
      - name: Guarded deterministic render and nonforce commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import pathlib,json,hashlib,re
          cp=json.loads(pathlib.Path('project-control/PRODUCTION-CHECKPOINT.json').read_text())
          ix=json.loads(pathlib.Path('project-control/ACADEMIC_READINESS_75_TOPIC_STATUS_INDEX.json').read_text())
          assert cp['total_topics']==ix['total_topics']==len(cp['topics'])==75
          assert len(list(pathlib.Path('project-control/academic-readiness').glob('[2-6]-[1-3]-[1-5].json')))==75
          assert len({t['id'] for t in cp['topics']})==75
          assert sorted(t['id'] for t in cp['topics'])==sorted(p.stem for p in pathlib.Path('project-control/academic-readiness').glob('[2-6]-[1-3]-[1-5].json'))
          assert all(t['readiness_status']==json.loads((pathlib.Path('project-control/academic-readiness')/(t['id']+'.json')).read_text())['status'] for t in cp['topics'])
          assert sum(t['readiness_status']=='IN_PROGRESS' for t in cp['topics'])==len(ix['pilot_in_progress'])
          assert sum(t['readiness_status']=='ASSESSED_REBUILD_REQUIRED' for t in cp['topics'])==len(ix['assessed_rebuild_required'])
          assert sum(t['readiness_status']=='NOT_ASSESSED' for t in cp['topics'])==ix['not_assessed_count']
          assert all((pathlib.Path(t['path'])/'complete-notes.pdf').is_file() for t in cp['topics'])
          root=pathlib.Path('Paper 3/Unit 3 - Governance/Topic 5')
          assert hashlib.sha256((root/'complete-notes.pdf').read_bytes()).hexdigest()=='e9eef9691b39e293a8c030cefffba34650a4ddd9266abccb03e806008daa3825'
          mcq=(root/'source/original-mcqs.md').read_text()
          assert len(re.findall(r'(?m)^### MCQ \d+\.',mcq))==30
          assert len(re.findall(r'\*\*Answer:\s*[ABCD]',mcq))==25
          PY
            python 'Paper 3/Unit 3 - Governance/Topic 5/source/build_topic.py'
            python - <<'PY'
          import pathlib,json,hashlib,fitz,re
          root=pathlib.Path('Paper 3/Unit 3 - Governance/Topic 5')
          pdf=root/'source/integrated-student-edition-2026-10-27.pdf'
          doc=fitz.open(pdf)
          assert 30<=len(doc)<=60
          assert all(len(p.get_text().strip())>60 for p in doc)
          assert 'Sevottam' in ''.join(p.get_text() for p in doc)
          assert hashlib.sha256((root/'complete-notes.pdf').read_bytes()).hexdigest()=='e9eef9691b39e293a8c030cefffba34650a4ddd9266abccb03e806008daa3825'
          assert 'source/integrated-student-edition-2026-10-27.pdf' in (root/'index.html').read_text()
          for i,p in enumerate(doc):
              for b in p.get_text('dict')['blocks']:
                  if b['type']==0:
                      x0,y0,x1,y1=b['bbox']
                      assert x0>=20 and y0>=0 and x1<=p.rect.width-15 and y1<=p.rect.height-8,(i+1,b['bbox'])
          m=json.loads((root/'manifest.json').read_text())
          assert m['original_mcqs']==30 and m['mains_answers']==6 and m['detailed_concept_chapters']==19
          assert len(doc)>=30 and sum(len(p.get_images()) for p in doc)>=3
          assert m.get('academically_approved',0)==0
          for rel,sha in m['file_sha256'].items():
              f=root/rel
              assert f.is_file() and hashlib.sha256(f.read_bytes()).hexdigest()==sha,rel
          out=pathlib.Path('project-control/academic-readiness/3-3-5-cycle34-render-qa.json')
          out.write_text(json.dumps({'topic_id':'3-3-5','pdf_pages':len(doc),'integrated_pdf_sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),'legacy_pdf_preserved':True,'originals_count':75,'blank_pages':0,'text_boundary_violations':0,'independent_academic_approval':False,'direct_browser_accessibility_verified':False},indent=2)+'\n')
          PY
            git add -- 'Paper 3/Unit 3 - Governance/Topic 5/source/complete-notes.md' 'Paper 3/Unit 3 - Governance/Topic 5/source/integrated-student-edition-2026-10-27.pdf' 'Paper 3/Unit 3 - Governance/Topic 5/index.html' 'Paper 3/Unit 3 - Governance/Topic 5/manifest.json' project-control/academic-readiness/3-3-5-cycle34-render-qa.json
            if git diff --cached --quiet; then echo 'Already synchronized'; exit 0; fi
            git commit -m 'Render Topic 3-3-5 synchronized integrated edition preserving original PDF'
            if git push origin HEAD:main; then exit 0; fi
            echo "Nonforce push raced main; retry $attempt"
          done
          exit 1
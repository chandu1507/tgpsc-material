name: Render Topic 4-2-1 Integrated Student Edition
on:
  push:
    branches: [main]
    paths:
      - 'Paper 4/Unit 2 - Telangana Economy/Topic 1/source/**'
      - '.github/workflows/render-topic-4-2-1-integrated.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tgpsc-topic-4-2-1-integrated
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic renderer and QA dependencies
        run: python -m pip install 'reportlab>=4,<5' 'markdown-it-py>=3,<5' 'pillow>=10,<13' 'beautifulsoup4>=4,<5' 'mistune>=3,<4' 'pymupdf>=1.24,<2'
      - name: Guarded nonforce integrated publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,subprocess,sys,unicodedata
          import fitz,mistune
          from bs4 import BeautifulSoup
          repo=Path('.')
          cp=json.loads(Path('project-control/PRODUCTION-CHECKPOINT.json').read_text())
          ix=json.loads(Path('project-control/ACADEMIC_READINESS_75_TOPIC_STATUS_INDEX.json').read_text())
          assert cp['total_topics']==ix['total_topics']==len(cp['topics'])==75
          assert len(list(Path('project-control/academic-readiness').glob('[2-6]-[1-3]-[1-5].json')))==75
          assert sum(t['readiness_status']=='IN_PROGRESS' for t in cp['topics'])==7
          assert sum(t['readiness_status']=='ASSESSED_REBUILD_REQUIRED' for t in cp['topics'])>=21
          assert cp['academically_approved']==ix['independently_academically_approved_count']==0
          assert all((Path(t['path'])/'complete-notes.pdf').is_file() for t in cp['topics'])
          root=Path('Paper 4/Unit 2 - Telangana Economy/Topic 1')
          src=root/'source'
          assert hashlib.sha256((root/'complete-notes.pdf').read_bytes()).hexdigest()=='5f6688d04b76f7eeb03e733c790737c4d216f95ef7eb8b9ca39093da331b19a7'
          parts=['syllabus-and-summary.md','quick-revision.md','detailed-notes.md','visual-learning.md','original-mcqs.md','answer-blueprints.md','mains-model-answers.md','sources-and-audit.md']
          md=(src/'complete-notes.md').read_text()
          assert md=='\n\n'.join((src/n).read_text().strip() for n in parts)+'\n'
          assert len(re.findall(r'(?m)^## \d+\.',(src/'detailed-notes.md').read_text()))==17
          assert len(re.findall(r'(?m)^### Q\d+\.',(src/'original-mcqs.md').read_text()))==27
          mains=(src/'mains-model-answers.md').read_text()
          counts=[]
          for body in re.split(r'(?m)^## Mains \d+\..*$',mains)[1:]:
              body=re.sub(r'(?m)^\*\*[^*]+\*\*\s*','',body)
              counts.append(len(re.findall(r"\b[\w]+(?:[-'][\w]+)*\b",body)))
          assert len(counts)==6 and min(counts)>=200,counts
          template=Path('scripts/render_topic_4_1_4_integrated.py').read_text()
          template=template.replace('Public Finance • Topic 4','Telangana Economy • Topic 1').replace('Paper IV Unit I Topic 4','Paper IV Unit II Topic 1')
          tmp=Path('/tmp/tgpsc_cycle41_renderer.py')
          tmp.write_text(template)
          pdf=src/'integrated-student-edition-2026-10-27.pdf'
          subprocess.run([sys.executable,str(tmp),'--input',str(src/'complete-notes.md'),'--output',str(pdf)],check=True)
          doc=fitz.open(pdf)
          assert 20<=len(doc)<=55
          assert all(len(page.get_text().strip())>60 for page in doc)
          assert sum(len(page.get_images()) for page in doc)>=3
          text='\n'.join(p.get_text() for p in doc)
          assert 'multidimensional poverty' in text.lower() and 'Model answer 6.' in text
          violations=[]
          for i,page in enumerate(doc):
              for block in page.get_text('dict')['blocks']:
                  if block['type']==0:
                      x0,y0,x1,y1=block['bbox']
                      if x0<10 or y0<0 or x1>page.rect.width-10 or y1>page.rect.height-3:violations.append(i+1)
          assert not violations,violations
          soup=BeautifulSoup((root/'index.html').read_text(),'html.parser')
          rendered=BeautifulSoup(mistune.create_markdown(plugins=['table','strikethrough'])('\n\n'.join((src/n).read_text().strip() for n in parts)),'html.parser')
          for im in rendered.find_all('img'):
              u=im.get('src','')
              if u.startswith('../visuals/'):im['src']='visuals/'+u.split('/')[-1]
          seen={}
          for h in rendered.find_all(['h1','h2','h3']):
              slug=re.sub(r'[^a-z0-9]+','-',unicodedata.normalize('NFKD',h.get_text(' ',strip=True).lower()).encode('ascii','ignore').decode()).strip('-') or 'heading'
              num=seen.get(slug,0);seen[slug]=num+1
              h['id']=slug if num==0 else f'{slug}-{num+1}'
          main=soup.select_one('main');assert main is not None
          main.clear()
          for child in list(rendered.contents):main.append(child)
          nav=soup.select_one('nav');assert nav is not None
          nav.clear()
          for href,label in [('../../../index.html','75-topic portal'),('complete-notes.pdf','Original PDF'),('source/complete-notes.md','Editable master'),('source/integrated-student-edition-2026-10-27.pdf','Integrated PDF')]:
              a=soup.new_tag('a',href=href);a.string=label;nav.append(a)
          for h in main.find_all(['h1','h2','h3']):
              a=soup.new_tag('a',href='#'+h['id']);a['class']=['toc'+h.name[-1]];a.string=h.get_text(' ',strip=True);nav.append(a)
          if not soup.select_one('header a[href="source/integrated-student-edition-2026-10-27.pdf"]'):
              a=soup.new_tag('a',href='source/integrated-student-edition-2026-10-27.pdf');a.string=' | Integrated PDF';soup.header.append(a)
          ids={x['id'] for x in soup.select('[id]')}
          assert all(a['href'][1:] in ids for a in soup.select('a[href^="#"]') if not a['href'].startswith('#/'))
          assert all((root/im['src']).is_file() for im in soup.select('img[src^="visuals/"]'))
          (root/'index.html').write_text(str(soup))
          manifest=json.loads((root/'manifest.json').read_text())
          manifest['date']='2026-10-27'
          manifest['syllabus_provenance']='Official TGPSC PDF fresh retrieval 403: R1 IN_PROGRESS, not PASS'
          manifest['production_status']='cycle41_CI_integrated_pdf_and_offline_html; browser accessibility pending'
          manifest['academic_status']='not_approved'
          manifest['word_count_complete_markdown']=len(md.split())
          manifest['pdf_pages']=len(doc)
          manifest['files']={str(f.relative_to(root)):{'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'bytes':f.stat().st_size} for f in sorted(root.rglob('*')) if f.is_file() and f.name!='manifest.json'}
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          qa={'date':'2026-10-27','topic':'4-2-1','pages':len(doc),'pdf_sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),'embedded_images':sum(len(p.get_images()) for p in doc),'blank_pages':0,'text_boundary_violations':0,'original_pdf_sha256':hashlib.sha256((root/'complete-notes.pdf').read_bytes()).hexdigest(),'manifest_hashes':len(manifest['files']),'mains_body_only_words':counts,'academically_approved':False,'browser_accessibility_certified':False,'r1':'IN_PROGRESS'}
          Path('project-control/academic-readiness/4-2-1-cycle41-ci-render-qa.json').write_text(json.dumps(qa,indent=2)+'\n')
          status_path=Path('project-control/academic-readiness/4-2-1.json')
          status=json.loads(status_path.read_text())
          status['gate_status']['R8']='IN_PROGRESS'
          status.setdefault('cycle41',{})['remote_integrated_edition_rendered']=True
          status['cycle41']['ci_integrated_pdf_sha256']=qa['pdf_sha256']
          status['cycle41']['ci_integrated_pdf_pages']=qa['pages']
          status_path.write_text(json.dumps(status,indent=2)+'\n')
          print(qa)
          PY
            git add -- 'Paper 4/Unit 2 - Telangana Economy/Topic 1/index.html' 'Paper 4/Unit 2 - Telangana Economy/Topic 1/manifest.json' 'Paper 4/Unit 2 - Telangana Economy/Topic 1/source/integrated-student-edition-2026-10-27.pdf' 'project-control/academic-readiness/4-2-1-cycle41-ci-render-qa.json' 'project-control/academic-readiness/4-2-1.json'
            if git diff --cached --quiet; then echo 'Already synchronized'; exit 0; fi
            git commit -m 'Render synchronized Topic 4-2-1 PDF and offline HTML'
            if git push origin HEAD:main; then exit 0; fi
            echo "Nonforce push raced main; retry $attempt"
          done
          exit 1

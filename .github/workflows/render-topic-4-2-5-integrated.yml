name: Render Topic 4-2-5 Integrated Student Edition
on:
  push:
    branches: [main]
    paths:
      - 'Paper 4/Unit 2 - Telangana Economy/Topic 5/source/*.md'
      - 'scripts/publish_topic_4_2_5.py'
      - 'scripts/render_topic_4_2_5_integrated.py'
      - '.github/workflows/render-topic-4-2-5-integrated.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tgpsc-topic-4-2-5-integrated
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic rendering and QA dependencies
        run: python -m pip install 'reportlab>=4,<5' 'markdown-it-py>=3,<5' 'pillow>=10,<13' 'beautifulsoup4>=4,<5' 'mistune>=3,<4' 'pymupdf>=1.24,<2'
      - name: Guarded nonforce source-to-PDF and HTML publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/publish_topic_4_2_5.py
            git add -- 'Paper 4/Unit 2 - Telangana Economy/Topic 5/source/complete-notes.md' 'Paper 4/Unit 2 - Telangana Economy/Topic 5/index.html' 'Paper 4/Unit 2 - Telangana Economy/Topic 5/manifest.json' 'Paper 4/Unit 2 - Telangana Economy/Topic 5/README.md' 'Paper 4/Unit 2 - Telangana Economy/Topic 5/QA-REPORT.md' 'Paper 4/Unit 2 - Telangana Economy/Topic 5/source/integrated-student-edition-2026-10-27.pdf'
            if git diff --cached --quiet; then
              echo 'Integrated edition already synchronized'
              exit 0
            fi
            git commit -m 'CI: synchronize Topic 4-2-5 integrated Markdown HTML PDF and manifest'
            if git push origin HEAD:main; then
              echo 'Guarded nonforce publication succeeded'
              exit 0
            fi
            echo 'Main advanced; retrying from fresh main'
            sleep 5
          done
          echo 'Nonforce publication could not be reconciled' >&2
          exit 1

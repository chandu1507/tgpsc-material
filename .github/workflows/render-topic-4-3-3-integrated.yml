name: Render Topic 4-3-3 Integrated Student Edition
on:
  push:
    branches: [main]
    paths:
      - 'Paper 4/Unit 3 - Development and Environmental Problems/Topic 3/source/**'
      - 'Paper 4/Unit 3 - Development and Environmental Problems/Topic 3/visuals/energy-flow.svg'
      - 'scripts/publish_topic_4_3_3.py'
      - 'scripts/render_topic_4_3_3_integrated.py'
      - '.github/workflows/render-topic-4-3-3-integrated.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tgpsc-topic-4-3-3-integrated
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic renderer and verification dependencies
        run: python -m pip install 'reportlab>=4,<5' 'markdown-it-py>=3,<5' 'pillow>=10,<13' 'beautifulsoup4>=4,<5' 'mistune>=3,<4' 'pymupdf>=1.24,<2' 'cairosvg>=2.7,<3'
      - name: Guarded nonforce source-to-PDF and offline HTML publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/publish_topic_4_3_3.py
            git add -- 'Paper 4/Unit 3 - Development and Environmental Problems/Topic 3/index.html' 'Paper 4/Unit 3 - Development and Environmental Problems/Topic 3/manifest.json' 'Paper 4/Unit 3 - Development and Environmental Problems/Topic 3/README.md' 'Paper 4/Unit 3 - Development and Environmental Problems/Topic 3/QA-REPORT.md' 'Paper 4/Unit 3 - Development and Environmental Problems/Topic 3/visuals/energy-flow.png' 'Paper 4/Unit 3 - Development and Environmental Problems/Topic 3/source/integrated-student-edition-cycle47.pdf' 'project-control/academic-readiness/4-3-3-cycle47-ci-render-qa-2026-10-28.json'
            if git diff --cached --quiet; then
              echo 'Already synchronized'
              exit 0
            fi
            git commit -m 'CI: synchronize Topic 4-3-3 integrated source PDF HTML and manifest'
            if git push origin HEAD:main; then
              echo 'Guarded nonforce publication succeeded'
              exit 0
            fi
            echo 'Main advanced; retrying from fresh main'
            sleep 5
          done
          echo 'Publication failed without force-push' >&2
          exit 1

name: Render Topic 5-2-3 Integrated Student Edition
on:
  push:
    branches: [main]
    paths:
      - 'Paper 5/Unit 2 - Modern Applications of Science/Topic 3/source/complete-notes.md'
      - 'Paper 5/Unit 2 - Modern Applications of Science/Topic 3/diagrams/*.svg'
      - 'Paper 5/Unit 2 - Modern Applications of Science/Topic 3/source/visual-learning.md'
      - 'scripts/publish_topic_5_2_3.py'
      - 'scripts/render_topic_5_2_3_integrated.py'
      - '.github/workflows/render-topic-5-2-3-integrated.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tgpsc-topic-5-2-3-integrated
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic rendering dependencies
        run: |
          python -m pip install 'reportlab>=4,<5' 'markdown-it-py>=3,<5' 'pillow>=10,<13' 'beautifulsoup4>=4,<5' 'mistune>=3,<4' 'pymupdf>=1.24,<2' 'svglib>=1.5,<2'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
      - name: Guarded nonforce PDF, HTML and manifest publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          chapter='Paper 5/Unit 2 - Modern Applications of Science/Topic 3'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/publish_topic_5_2_3.py
            git add -- "$chapter/index.html" "$chapter/manifest.json" "$chapter/README.md" "$chapter/QA-REPORT.md" "$chapter/source/integrated-student-edition-cycle56.pdf" 'project-control/academic-readiness/5-2-3-cycle56-ci-render-qa-2026-10-28.json'
            if git diff --cached --quiet; then
              echo 'Topic 5-2-3 already synchronized'
              exit 0
            fi
            git commit -m 'CI: synchronize Topic 5-2-3 integrated PDF HTML and manifest'
            if git push origin HEAD:main; then
              echo 'Guarded nonforce publication succeeded'
              exit 0
            fi
            echo 'Main advanced; rebuilding from fresh main'
            sleep 5
          done
          echo 'Publication failed without force-push' >&2
          exit 1

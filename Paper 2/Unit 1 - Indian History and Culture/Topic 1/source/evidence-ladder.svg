<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="260" viewBox="0 0 1080 260"><rect width="1080" height="260" fill="#f6f8fc"/><text x="38" y="48" font-size="27" font-family="sans-serif" fill="#162544" font-weight="bold">Evidence-to-claim discipline</text><g font-family="sans-serif" font-size="19" fill="#122345" text-anchor="middle"><rect x="32" y="91" width="195" height="92" rx="12" fill="#d8e8fa" stroke="#345f95"/><text x="130" y="127">Material or text</text><text x="130" y="153">in context</text><rect x="250" y="91" width="190" height="92" rx="12" fill="#d8e8fa" stroke="#345f95"/><text x="345" y="127">Date and</text><text x="345" y="153">provenance</text><rect x="463" y="91" width="190" height="92" rx="12" fill="#d8e8fa" stroke="#345f95"/><text x="558" y="127">Independent</text><text x="558" y="153">cross-check</text><rect x="676" y="91" width="190" height="92" rx="12" fill="#e1f0dd" stroke="#54804d"/><text x="771" y="127">Bounded</text><text x="771" y="153">interpretation</text><rect x="889" y="91" width="165" height="92" rx="12" fill="#fff1d4" stroke="#a37830"/><text x="971" y="127">Remaining</text><text x="971" y="153">uncertainty</text></g><g fill="#345f95"><path d="M230 131 l16 0 -7 -8 m7 8 -7 8" stroke="#345f95" stroke-width="3" fill="none"/><path d="M443 131 l16 0 -7 -8 m7 8 -7 8" stroke="#345f95" stroke-width="3" fill="none"/><path d="M656 131 l16 0 -7 -8 m7 8 -7 8" stroke="#345f95" stroke-width="3" fill="none"/><path d="M869 131 l16 0 -7 -8 m7 8 -7 8" stroke="#345f95" stroke-width="3" fill="none"/></g><text x="38" y="230" font-family="sans-serif" font-size="16" fill="#45566b">Never convert a hypothesis into a fact merely because it is repeated in study notes.</text></svg>
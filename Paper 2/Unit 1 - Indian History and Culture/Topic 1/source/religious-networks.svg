<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="260" viewBox="0 0 1080 260"><rect width="1080" height="260" fill="#f6f8fc"/><text x="38" y="48" font-size="27" font-family="sans-serif" fill="#162544" font-weight="bold">How a religious tradition became a durable institution</text><g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#132b43"><rect x="45" y="100" width="190" height="82" rx="12" fill="#d8e8fa" stroke="#345f95"/><text x="140" y="135">Teaching and</text><text x="140" y="160">ethical discipline</text><rect x="275" y="100" width="190" height="82" rx="12" fill="#d8e8fa" stroke="#345f95"/><text x="370" y="135">Monastic rules</text><text x="370" y="160">and organisation</text><rect x="505" y="100" width="190" height="82" rx="12" fill="#e1f0dd" stroke="#54804d"/><text x="600" y="135">Lay donors and</text><text x="600" y="160">trade networks</text><rect x="735" y="100" width="300" height="82" rx="12" fill="#fff1d4" stroke="#a37830"/><text x="885" y="135">Monuments, inscriptions</text><text x="885" y="160">and regional continuity</text></g><g stroke="#345f95" stroke-width="3" fill="none"><path d="M239 141h31m-8 -8l8 8 -8 8"/><path d="M469 141h31m-8 -8l8 8 -8 8"/><path d="M699 141h31m-8 -8l8 8 -8 8"/></g><text x="45" y="229" font-family="sans-serif" font-size="16" fill="#45566b">Material support explains institutional endurance; doctrine explains ideals. Neither alone explains everything.</text></svg>
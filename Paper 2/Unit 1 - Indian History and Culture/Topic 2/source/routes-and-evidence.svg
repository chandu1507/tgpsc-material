<svg xmlns="http://www.w3.org/2000/svg" width="760" height="335" viewBox="0 0 760 335"><rect width="760" height="335" fill="white"/><text x="24" y="39" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#142d4b">Two routes of contact and their evidence</text><rect x="26" y="72" width="708" height="92" rx="12" fill="#eef4fb" stroke="#63738a"/><text x="45" y="98" font-size="18" font-weight="bold" fill="#132b49">Indian Ocean commerce</text><text x="45" y="123" font-size="15" fill="#24374e">Ports / merchant communities</text><text x="45" y="147" font-size="14" fill="#3c4c5e">Trade and migration</text><rect x="26" y="178" width="708" height="92" rx="12" fill="#fdf1e6" stroke="#63738a"/><text x="45" y="204" font-size="18" font-weight="bold" fill="#132b49">Territorial state formation</text><text x="45" y="229" font-size="15" fill="#24374e">Sind / Ghurid / Sultanate</text><text x="45" y="253" font-size="14" fill="#3c4c5e">Revenue, military, courts</text><text x="24" y="310" font-family="DejaVu Sans" font-size="14" fill="#3d4b5d">Do not collapse contact into conquest</text></svg>
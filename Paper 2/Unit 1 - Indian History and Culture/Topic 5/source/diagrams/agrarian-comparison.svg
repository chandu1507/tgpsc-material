<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-label="Three agrarian pathways — do not conflate"><rect width="1200" height="550" fill="#fff"/><text x="40" y="64" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#152B4F">Three agrarian pathways — do not conflate</text><rect x="40" y="110" width="360" height="315" rx="20" fill="#E6EFFC" stroke="#CBD5E1"/><text x="58" y="155" font-size="25" font-weight="bold" fill="#16243A">AIKS · 1936</text><text x="58" y="205" font-size="20" fill="#26384C">All-India federation</text><text x="58" y="249" font-size="20" fill="#26384C">Rent and debt</text><text x="58" y="293" font-size="20" fill="#26384C">Tenant rights</text><text x="58" y="337" font-size="20" fill="#26384C">Organising platform</text><rect x="430" y="110" width="360" height="315" rx="20" fill="#E5F5F0" stroke="#CBD5E1"/><text x="448" y="155" font-size="25" font-weight="bold" fill="#16243A">Tebhaga · 1946–47</text><text x="448" y="205" font-size="20" fill="#26384C">Bengal sharecroppers</text><text x="448" y="249" font-size="20" fill="#26384C">Two-thirds crop share</text><text x="448" y="293" font-size="20" fill="#26384C">Harvest and storage</text><text x="448" y="337" font-size="20" fill="#26384C">British India</text><rect x="820" y="110" width="360" height="315" rx="20" fill="#FFF0DB" stroke="#CBD5E1"/><text x="838" y="155" font-size="25" font-weight="bold" fill="#16243A">Telangana · 1946–51</text><text x="838" y="205" font-size="20" fill="#26384C">Vetti and landlordism</text><text x="838" y="249" font-size="20" fill="#26384C">Village Sanghams</text><text x="838" y="293" font-size="20" fill="#26384C">Hyderabad State</text><text x="838" y="337" font-size="20" fill="#26384C">1948 not the endpoint</text><text x="40" y="480" font-size="21" fill="#475569">Shared agrarian grievances, different demands and jurisdictions.</text></svg>
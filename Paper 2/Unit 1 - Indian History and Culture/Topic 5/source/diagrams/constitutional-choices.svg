<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-label="Constitutional choices and Hyderabad"><rect width="1200" height="550" fill="#fff"/><text x="40" y="64" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#152B4F">Constitutional choices and Hyderabad</text><rect x="40" y="110" width="360" height="315" rx="20" fill="#E6EFFC" stroke="#CBD5E1"/><text x="58" y="155" font-size="25" font-weight="bold" fill="#16243A">Cabinet Mission · May 1946</text><text x="58" y="205" font-size="20" fill="#26384C">Limited union</text><text x="58" y="249" font-size="20" fill="#26384C">Provincial grouping</text><text x="58" y="293" font-size="20" fill="#26384C">Competing readings</text><text x="58" y="337" font-size="20" fill="#26384C">Agreement failed</text><rect x="430" y="110" width="360" height="315" rx="20" fill="#E5F5F0" stroke="#CBD5E1"/><text x="448" y="155" font-size="25" font-weight="bold" fill="#16243A">Transfer · 1947</text><text x="448" y="205" font-size="20" fill="#26384C">3 June plan</text><text x="448" y="249" font-size="20" fill="#26384C">18 July Act</text><text x="448" y="293" font-size="20" fill="#26384C">15 August Dominions</text><text x="448" y="337" font-size="20" fill="#26384C">Displacement / violence</text><rect x="820" y="110" width="360" height="315" rx="20" fill="#FFF0DB" stroke="#CBD5E1"/><text x="838" y="155" font-size="25" font-weight="bold" fill="#16243A">Hyderabad State</text><text x="838" y="205" font-size="20" fill="#26384C">Section 7: lapse</text><text x="838" y="249" font-size="20" fill="#26384C">No automatic merger</text><text x="838" y="293" font-size="20" fill="#26384C">September 1948</text><text x="838" y="337" font-size="20" fill="#26384C">Separate agrarian timeline</text><text x="40" y="480" font-size="21" fill="#475569">Legal transfer, political integration and lived security are distinct.</text></svg>
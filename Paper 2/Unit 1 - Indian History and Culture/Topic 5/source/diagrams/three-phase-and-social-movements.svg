<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-label="Political phases and parallel social mobilisation"><rect width="1200" height="550" fill="#fff"/><text x="40" y="64" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#152B4F">Political phases and parallel social mobilisation</text><rect x="40" y="110" width="360" height="315" rx="20" fill="#E6EFFC" stroke="#CBD5E1"/><text x="58" y="155" font-size="25" font-weight="bold" fill="#16243A">1885–1905</text><text x="58" y="205" font-size="20" fill="#26384C">Congress forum</text><text x="58" y="249" font-size="20" fill="#26384C">Budget and services</text><text x="58" y="293" font-size="20" fill="#26384C">Drain critique</text><text x="58" y="337" font-size="20" fill="#26384C">Early local protests</text><rect x="430" y="110" width="360" height="315" rx="20" fill="#E5F5F0" stroke="#CBD5E1"/><text x="448" y="155" font-size="25" font-weight="bold" fill="#16243A">1905–1919</text><text x="448" y="205" font-size="20" fill="#26384C">Swadeshi and boycott</text><text x="448" y="249" font-size="20" fill="#26384C">Home Rule</text><text x="448" y="293" font-size="20" fill="#26384C">War and repression</text><text x="448" y="337" font-size="20" fill="#26384C">Continuing labour action</text><rect x="820" y="110" width="360" height="315" rx="20" fill="#FFF0DB" stroke="#CBD5E1"/><text x="838" y="155" font-size="25" font-weight="bold" fill="#16243A">1919–1947</text><text x="838" y="205" font-size="20" fill="#26384C">Gandhian mass politics</text><text x="838" y="249" font-size="20" fill="#26384C">AIKS / AITUC / AIWC</text><text x="838" y="293" font-size="20" fill="#26384C">Left movements</text><text x="838" y="337" font-size="20" fill="#26384C">Partition negotiations</text><text x="40" y="480" font-size="21" fill="#475569">Phases overlap; social movements have distinct goals and histories.</text></svg>
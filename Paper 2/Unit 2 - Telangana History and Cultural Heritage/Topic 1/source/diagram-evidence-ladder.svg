<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 562" width="900" height="562">
<rect width="900" height="562" fill="#f6f8fc"/>
<text x="32" y="53" font-size="29" font-family="Arial" fill="#17335a" font-weight="bold">From artefact to historical claim</text>
<rect x="25" y="90" rx="12" width="850" height="72" fill="#e3edf8" stroke="#b6c6d8"/>
<text x="43" y="119" font-family="Arial" font-size="20" font-weight="bold" fill="#1a3554">Observed object</text>
<text x="43" y="146" font-family="Arial" font-size="17" fill="#334b61">Coin, inscription, pottery or architectural feature</text>
<rect x="25" y="178" rx="12" width="850" height="72" fill="#edf4e9" stroke="#b6c6d8"/>
<text x="43" y="207" font-family="Arial" font-size="20" font-weight="bold" fill="#1a3554">Context and chronology</text>
<text x="43" y="234" font-family="Arial" font-size="17" fill="#334b61">Layer, palaeography, associated objects and dated comparison</text>
<rect x="25" y="266" rx="12" width="850" height="72" fill="#fff0e0" stroke="#b6c6d8"/>
<text x="43" y="295" font-family="Arial" font-size="20" font-weight="bold" fill="#1a3554">Limited inference</text>
<text x="43" y="322" font-family="Arial" font-size="17" fill="#334b61">Circulation, recorded gift, building phase or patronage</text>
<rect x="25" y="354" rx="12" width="850" height="72" fill="#e3edf8" stroke="#b6c6d8"/>
<text x="43" y="383" font-family="Arial" font-size="20" font-weight="bold" fill="#1a3554">Qualified historical model</text>
<text x="43" y="410" font-family="Arial" font-size="17" fill="#334b61">State formation, trade networks and religious institutions</text>
<text x="30" y="536" font-family="Arial" font-size="16" fill="#44576b">Never turn a findspot directly into a claim of sovereignty.</text></svg>
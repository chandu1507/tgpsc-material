<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370">
<rect width="900" height="370" fill="#f6f9fd"/>
<text x="28" y="39" font-family="DejaVu Sans" font-weight="bold" font-size="23" fill="#132c48">B. Tank, society and political authority</text>
<text x="28" y="63" font-family="DejaVu Sans" font-size="12" fill="#475569">Causal links are interpretive, not a medieval administrative flowchart.</text>
<rect x="25" y="105" width="155" height="72" rx="12" fill="#e4eef8" stroke="#5b7998" stroke-width="1.4"/>
<text x="102.5" y="130" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#173653">Seasonal</text>
<text x="102.5" y="149" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#173653">rainfall</text>
<rect x="205" y="105" width="155" height="72" rx="12" fill="#e4eef8" stroke="#5b7998" stroke-width="1.4"/>
<text x="282.5" y="130" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#173653">Tank storage</text>
<text x="282.5" y="149" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#173653">and repair</text>
<rect x="385" y="105" width="155" height="72" rx="12" fill="#e4eef8" stroke="#5b7998" stroke-width="1.4"/>
<text x="462.5" y="130" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#173653">Cultivation</text>
<text x="462.5" y="149" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#173653">and surplus</text>
<rect x="565" y="105" width="155" height="72" rx="12" fill="#e4eef8" stroke="#5b7998" stroke-width="1.4"/>
<text x="642.5" y="130" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#173653">Local elites</text>
<text x="642.5" y="149" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#173653">and revenue</text>
<rect x="745" y="105" width="130" height="72" rx="12" fill="#e4eef8" stroke="#5b7998" stroke-width="1.4"/>
<text x="810.0" y="130" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#173653">Patronage</text>
<text x="810.0" y="149" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#173653">and troops</text>
<rect x="255" y="235" width="395" height="70" rx="12" fill="#e4eef8" stroke="#5b7998" stroke-width="1.4"/>
<text x="452.5" y="260" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#173653">Cross-cutting: labour, land rights, water access</text>
<text x="452.5" y="279" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#173653">and unequal benefits</text>
<line x1="180" y1="140" x2="205" y2="140" stroke="#a0522d" stroke-width="2"/>

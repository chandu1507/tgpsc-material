<path d="M377,135 L385,140 L377,145" fill="none" stroke="#a0522d" stroke-width="2"/>
<line x1="540" y1="140" x2="565" y2="140" stroke="#a0522d" stroke-width="2"/>
<path d="M557,135 L565,140 L557,145" fill="none" stroke="#a0522d" stroke-width="2"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330"><rect width="1000" height="330" fill="#f7f9fc"/><text x="500" y="38" text-anchor="middle" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#13294b">Constrained autonomy: how paramountcy operated</text><rect x="25" y="82" width="270" height="100" rx="12" fill="#dbeafe" stroke="#32609c"/><text x="160" y="117" text-anchor="middle" font-size="17" font-family="DejaVu Sans">Treaties &amp; Resident</text><text x="160" y="148" text-anchor="middle" font-size="14" font-family="DejaVu Sans">External diplomacy constrained</text><rect x="364" y="82" width="270" height="100" rx="12" fill="#fef3c7" stroke="#b45309"/><text x="499" y="117" text-anchor="middle" font-size="17" font-family="DejaVu Sans">Military finance</text><text x="499" y="148" text-anchor="middle" font-size="14" font-family="DejaVu Sans">Contingent / Berar leverage</text><rect x="705" y="82" width="270" height="100" rx="12" fill="#dcfce7" stroke="#166534"/><text x="840" y="117" text-anchor="middle" font-size="17" font-family="DejaVu Sans">Internal departments</text><text x="840" y="148" text-anchor="middle" font-size="14" font-family="DejaVu Sans">Reform remained possible</text><path d="M296 132 L361 132 M636 132 L702 132" stroke="#475569" stroke-width="4"/><path d="M350 123 L361 132 L350 141 M691 123 L702 132 L691 141" stroke="#475569" stroke-width="4" fill="none"/><text x="500" y="241" text-anchor="middle" font-size="18" font-family="DejaVu Sans" fill="#334155">Result: state-building and imperial dependence coexisted</text><text x="500" y="275" text-anchor="middle" font-size="14" font-family="DejaVu Sans" fill="#64748b">Treaty text must be checked before quoting individual clauses.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="950" height="255" viewBox="0 0 950 255"><rect width="950" height="255" rx="16" fill="#f6f8fc"/><text x="24" y="30" font-size="19" font-family="DejaVu Sans" font-weight="bold" fill="#173054">Evidence ladder: what can each source establish?</text><rect x="18" y="46" width="914" height="46" rx="8" fill="#e0e7ff"/><text x="28" y="64" font-size="14" font-family="DejaVu Sans" font-weight="bold" fill="#173054">Original minute / gazette / register</text><text x="420" y="64" font-size="13" font-family="DejaVu Sans" font-weight="normal" fill="#173054">Event wording, orders, attendance</text><text x="420" y="82" font-size="12" font-family="DejaVu Sans" font-weight="normal" fill="#555">NOT OBTAINED in this run</text><rect x="18" y="97" width="914" height="46" rx="8" fill="#dbeafe"/><text x="28" y="115" font-size="14" font-family="DejaVu Sans" font-weight="bold" fill="#173054">Institutional self-history</text><text x="420" y="115" font-size="13" font-family="DejaVu Sans" font-weight="normal" fill="#173054">Institution’s retrospective account</text><text x="420" y="133" font-size="12" font-family="DejaVu Sans" font-weight="normal" fill="#555">Read for Parishath and AMS</text><rect x="18" y="148" width="914" height="46" rx="8" fill="#ecfccb"/><text x="28" y="166" font-size="14" font-family="DejaVu Sans" font-weight="bold" fill="#173054">Government textbook / scholarly abstract</text><text x="420" y="166" font-size="13" font-family="DejaVu Sans" font-weight="normal" fill="#173054">Interpretation and scope</text><text x="420" y="184" font-size="12" font-family="DejaVu Sans" font-weight="normal" fill="#555">Checked, not original files</text><rect x="18" y="199" width="914" height="46" rx="8" fill="#fee2e2"/><text x="28" y="217" font-size="14" font-family="DejaVu Sans" font-weight="bold" fill="#173054">Commemorative or press retrospective</text><text x="420" y="217" font-size="13" font-family="DejaVu Sans" font-weight="normal" fill="#1730
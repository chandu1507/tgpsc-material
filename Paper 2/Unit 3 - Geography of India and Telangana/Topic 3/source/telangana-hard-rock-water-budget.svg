<svg xmlns="http://www.w3.org/2000/svg" width="920" height="370" viewBox="0 0 920 370" role="img" aria-label="Conceptual water balance showing rainfall, runoff, infiltration, recharge, groundwater storage, and stream baseflow">
<title>Telangana hard-rock catchment: two accounting scales</title><desc>Conceptual diagram, not a surveyed map. Recharge transfers water from soil into the aquifer and must not be counted twice as an independent whole-catchment loss.</desc>
<rect width="920" height="370" fill="#f6f9fd"/><text x="30" y="37" font-size="24" font-family="sans-serif" fill="#173453" font-weight="bold">Hard-rock catchment water balance</text>
<g font-family="sans-serif" font-size="17" fill="#173453" stroke="#3a6b95" stroke-width="2">
<rect x="330" y="65" width="260" height="55" rx="9" fill="#d7e9fb"/><text x="370" y="98" stroke="none">Rainfall (external input)</text>
<rect x="45" y="170" width="220" height="60" rx="9" fill="#e8f1f8"/><text x="79" y="205" stroke="none">Surface runoff</text>
<rect x="345" y="170" width="230" height="60" rx="9" fill="#e8f1f8"/><text x="392" y="205" stroke="none">Soil infiltration</text>
<rect x="650" y="170" width="220" height="60" rx="9" fill="#e8f1f8"/><text x="682" y="205" stroke="none">Evapotranspiration</text>
<rect x="345" y="272" width="230" height="60" rx="9" fill="#cce3dd"/><text x="362" y="297" stroke="none">Aquifer recharge</text><text x="367" y="318" stroke="none" font-size="14">(internal transfer)</text>
</g><g stroke="#2b668d" stroke-width="3" fill="none"><path d="M420 120 L180 170"/><path d="M460 120 L460 170"/><path d="M510 120 L750 170"/><path d="M460 230 L460 272"/></g><g fill="#2b668d"><path d="M180 170 l8 -12 l4 14 z"/><path d="M460 170 l-7 -12 h14 z"/><path d="M750 170 l-12 -6 l4 -8 z"/><path d="M460 272 l-7 -12 h14 z"/></g>
<text x="35" y="356" font-family="sans-serif" font-size="13" fill="#3d5266">Whole-catchment budget: inputs = external outputs + change in total storage. Recharge is not an extra loss.</text>
</svg>
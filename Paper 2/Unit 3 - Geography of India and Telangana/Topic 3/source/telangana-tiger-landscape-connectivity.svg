<svg xmlns="http://www.w3.org/2000/svg" width="920" height="350" viewBox="0 0 920 350" role="img" aria-label="Conceptual reserve core, buffer, landscape corridor and human-use areas">
<title>Tiger landscape conservation: habitat connectivity and rights</title><desc>Conceptual habitat schematic for exam learning; not an official boundary map of Amrabad or Kawal.</desc>
<rect width="920" height="350" fill="#f6f9fd"/><text x="28" y="39" font-size="23" font-family="sans-serif" font-weight="bold" fill="#173453">Conservation works across boundaries</text>
<g stroke="#35735b" stroke-width="3"><rect x="35" y="90" width="235" height="145" rx="20" fill="#d7ebdb"/><rect x="85" y="128" width="135" height="68" rx="17" fill="#87bc96"/><rect x="640" y="90" width="245" height="145" rx="20" fill="#d7ebdb"/><rect x="693" y="128" width="139" height="68" rx="17" fill="#87bc96"/></g>
<g font-family="sans-serif" fill="#123d2b" font-size="16" text-anchor="middle"><text x="152" y="117">Reserve A: buffer</text><text x="152" y="168" font-weight="bold">Core</text><text x="762" y="117">Reserve B: buffer</text><text x="762" y="168" font-weight="bold">Core</text></g>
<rect x="288" y="135" width="330" height="55" rx="13" fill="#e6f0d4" stroke="#638345" stroke-width="2"/><text x="453" y="168" font-family="sans-serif" text-anchor="middle" font-size="17" fill="#3c5730">Functional habitat corridor</text>
<g font-family="sans-serif" font-size="15" fill="#29405b"><text x="44" y="275">Monitor: prey • vegetation • fire • roads • human conflict</text><text x="44" y="302">Include: forest-dependent livelihoods, rights, and safe crossings</text><text x="44" y="328" font-size="12">Illustrative topology only. Do not infer geographic proximity or actual reserve boundaries.</text></g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Indian society: negotiated integration, enabling institutions and risks</title>
<desc id="desc">Three inputs, constitutional rights, economic interdependence and cultural interaction, contribute to negotiated integration. Exclusion and unequal power can disrupt every pathway. Outcomes must be tested through access, participation and accountability.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#274c77"/></marker></defs>
<rect width="1100" height="620" fill="#f8fafc"/>
<text x="550" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#12304d">Integration is produced, not assumed</text>
<text x="550" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#334155">Indian Society · Paper III / Unit I / Topic 1 · original analytical diagram</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="35" y="155" width="310" height="126" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="190" y="192" font-size="21" font-weight="700" fill="#1e3a8a">Constitutional membership</text>
<text x="190" y="220" font-size="16" fill="#1e40af">Equal rights, protection, voice</text>
<text x="190" y="246" font-size="16" fill="#1e40af">Public institutions and remedies</text>
<rect x="395" y="155" width="310" height="126" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="550" y="192" font-size="21" font-weight="700" fill="#166534">Economic connections</text>
<text x="550" y="220" font-size="16" fill="#166534">Labour, markets, migration</text>
<text x="550" y="246" font-size="16" fill="#166534">Services and interdependence</text>
<rect x="755" y="155" width="310" height="126" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="910" y="192" font-size="21" font-weight="700" fill="#92400e">Cultural interaction</text>
<text x="910" y="220" font-size="16" fill="#92400e">Languages, exchange, dialogue</text>
<text x="910" y="246" font-size="16" fill="#92400e">Cross-community encounters</text>
</g>
<g stroke="#274c77" stroke-width="3" fill="none" marker-end="url(#arrow)">
<path d="M190,281 L190,322 L470,370"/>
<path d="M550,281 L550,359"/>
<path d="M910,281 L910,322 L630,370"/>
</g>
<rect x="337" y="369" width="426" height="85" rx="18" fill="#e0e7ff" stroke="#4338ca" stroke-width="3"/>
<text x="550" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#312e81">Negotiated social integration</text>
<text x="550" y="429" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#3730a3">Never automatic or uniform across groups</text>
<path d="M550,454 L550,485" stroke="#274c77" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="265" y="489" width="570" height="66" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="550" y="518" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#1e293b">Test outcomes: access · participation · accountability</text>
<text x="550" y="541" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Use disaggregated evidence; do not infer harmony from diversity alone</text>
<rect x="35" y="582" width="1030" height="26" rx="6" fill="#fee2e2"/>
<text x="550" y="601" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#991b1b">Cross-cutting risks: exclusion, discrimination, unequal resources and political voice can interrupt every pathway</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" role="img" aria-label="Article 20 decision tree: retrospective penalty, repeated prosecution and punishment, and compelled testimony">
<rect width="880" height="260" fill="#ffffff"/>
<text x="440" y="28" text-anchor="middle" font-size="21" font-family="DejaVu Sans" font-weight="bold" fill="#18344d">Article 20 — identify the precise criminal-law issue</text>
<rect x="320" y="44" width="240" height="43" rx="9" fill="#e7f2fa" stroke="#2c6b99"/>
<text x="440" y="70" text-anchor="middle" font-family="DejaVu Sans" font-size="14">What State action is challenged?</text>
<path d="M440 87 V112 M145 112 H735 M145 112 V129 M440 112 V129 M735 112 V129" fill="none" stroke="#2c6b99" stroke-width="2"/>
<rect x="20" y="129" width="250" height="85" rx="8" fill="#f4f8fc" stroke="#2c6b99"/>
<text x="145" y="151" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="14">20(1) — retrospective penalty</text>
<text x="145" y="172" text-anchor="middle" font-family="DejaVu Sans" font-size="11">Compare act date and law date</text>
<text x="145" y="191" text-anchor="middle" font-family="DejaVu Sans" font-size="11">No later harsher punishment</text>
<rect x="315" y="129" width="250" height="85" rx="8" fill="#f4f8fc" stroke="#2c6b99"/>
<text x="440" y="151" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="14">20(2) — same offence</text>
<text x="440" y="172" text-anchor="middle" font-family="DejaVu Sans" font-size="11">Check prosecution AND punishment</text>
<text x="440" y="191" text-anchor="middle" font-family="DejaVu Sans" font-size="11">Not merely a second inquiry</text>
<rect x="610" y="129" width="250" height="85" rx="8" fill="#f4f8fc" stroke="#2c6b99"/>
<text x="735" y="151" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="14">20(3) — compelled testimony</text>
<text x="735" y="172" text-anchor="middle" font-family="DejaVu Sans" font-size="11">Accused + compulsion + witness</text>
<text x="735" y="191" text-anchor="middle" font-family="DejaVu Sans" font-size="11">Forensic questions need case law</text>
<text x="440" y="242" text-anchor="middle" font-family="DejaVu Sans" font-size="11" fill="#4d5c6b">Teaching schematic • verify the constitutional text and governing judgments</text>
</svg>
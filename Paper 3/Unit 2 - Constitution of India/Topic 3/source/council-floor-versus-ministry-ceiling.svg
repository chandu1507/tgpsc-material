<svg xmlns="http://www.w3.org/2000/svg" width="850" height="240" viewBox="0 0 850 240"><title>Article 171 Council versus Article 164 ministry</title><rect width="850" height="240" fill="white"/><text x="20" y="30" font-family="sans-serif" font-size="20">Telangana: two constitutional calculations</text><rect x="20" y="50" width="395" height="155" fill="#e8f3fa" stroke="#245780"/><rect x="435" y="50" width="395" height="155" fill="#eaf4e7" stroke="#407443"/><g font-family="sans-serif" font-size="15"><text x="36" y="80">Article 171: Legislative Council</text><text x="36" y="110">One-third of 119 = 39.67</text><text x="36" y="138">Proviso: minimum 40 members</text><text x="36" y="173">Telangana Council: 40 seats</text><text x="450" y="80">Article 164: Council of Ministers</text><text x="450" y="110">15% of 119 = 17.85</text><text x="450" y="138">Minimum 12 ministers</text><text x="450" y="173">Maximum 17, including CM</text></g><text x="20" y="226" font-family="sans-serif" font-size="11">Sources: Constitution Articles 171(1), 164(1A); Telangana Legislative Affairs.</text></svg>
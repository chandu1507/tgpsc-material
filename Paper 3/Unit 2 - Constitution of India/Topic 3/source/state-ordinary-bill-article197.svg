<svg xmlns="http://www.w3.org/2000/svg" width="850" height="235" viewBox="0 0 850 235"><title>Article 197 state ordinary bill route</title><rect width="850" height="235" fill="white"/><text x="20" y="30" font-family="sans-serif" font-size="20">State ordinary bill: Article 197</text><g fill="#e8f3fa" stroke="#245780"><rect x="15" y="58" width="150" height="80"/><rect x="185" y="58" width="150" height="80"/><rect x="355" y="58" width="150" height="80"/><rect x="525" y="58" width="150" height="80"/><rect x="695" y="58" width="140" height="80"/></g><g font-family="sans-serif" font-size="13" text-anchor="middle"><text x="90" y="87">Assembly passes</text><text x="90" y="109">ordinary bill</text><text x="260" y="87">Council first stage</text><text x="260" y="109">up to 3 months</text><text x="430" y="87">Assembly</text><text x="430" y="109">repasses</text><text x="600" y="87">Council second</text><text x="600" y="109">up to 1 month</text><text x="765" y="87">Assembly</text><text x="765" y="109">prevails</text></g><g stroke="#245780" stroke-width="2"><path d="M165 99 H185 M335 99 H355 M505 99 H525 M675 99 H695"/></g><rect x="150" y="158" width="550" height="43" fill="#eaf4e7" stroke="#407443"/><text x="425" y="184" text-anchor="middle" font-family="sans-serif" font-size="14">Article 200 Governor stage is separate; no state joint sitting.</text><text x="20" y="225" font-family="sans-serif" font-size="11">Applies to the specified Assembly-origin ordinary-bill route, not Money Bills.</text></svg>
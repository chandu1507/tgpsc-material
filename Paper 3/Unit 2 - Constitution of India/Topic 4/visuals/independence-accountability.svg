<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="650" viewBox="0 0 1150 650"><rect width="1150" height="650" fill="#f7f9fc"/><text x="575" y="56" font-size="31" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle" fill="#152b49">Independence and accountability: two safeguards</text><rect x="80" y="118" width="445" height="335" rx="18" fill="#e2f0ff" stroke="#2363a1" stroke-width="3"/><rect x="625" y="118" width="445" height="335" rx="18" fill="#fff0df" stroke="#ca7c2d" stroke-width="3"/><text x="302" y="167" font-size="28" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle" fill="#204f82">INDEPENDENCE</text><text x="847" y="167" font-size="28" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle" fill="#9b5d1d">ACCOUNTABILITY</text><g font-family="DejaVu Sans" font-size="20" fill="#173957"><text x="115" y="220">• Protected tenure</text><text x="115" y="273">• Fair appointment process</text><text x="115" y="326">• Decisional autonomy</text><text x="115" y="379">• High Court control (Art. 235)</text></g><g font-family="DejaVu Sans" font-size="20" fill="#704315"><text x="660" y="220">• Reasoned judgments</text><text x="660" y="273">• Open courts and appeals</text><text x="660" y="326">• Ethics, recusal, disclosure</text><text x="660" y="379">• Fair misconduct process</text></g><path d="M302 454 L500 520 M847 454 L650 520" stroke="#65829d" stroke-width="6"/><rect x="330" y="511" width="490" height="93" rx="17" fill="#183b63"/><text x="575" y="547" font-size="26" font-family="DejaVu Sans" fill="white" text-anchor="middle" font-weight="bold">PUBLIC TRUST</text><text x="575" y="580" font-size="18" font-family="DejaVu Sans" fill="white" text-anchor="middle">Accessible, fair, enforceable justice</text></svg>
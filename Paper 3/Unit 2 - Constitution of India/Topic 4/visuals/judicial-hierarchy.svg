<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="650" viewBox="0 0 1150 650"><rect width="1150" height="650" fill="#f5f8fc"/><text x="575" y="54" font-size="31" font-family="DejaVu Sans" font-weight="bold" text-anchor="middle" fill="#152b49">Indian judicial structure and review routes</text><rect x="380" y="100" width="390" height="90" rx="14" fill="#153b65"/><text x="575" y="138" fill="white" font-size="25" font-family="DejaVu Sans" text-anchor="middle">SUPREME COURT</text><text x="575" y="169" fill="white" font-size="16" font-family="DejaVu Sans" text-anchor="middle">Articles 32, 131, 136, 141</text><path d="M575 190 V240" stroke="#ff9a3d" stroke-width="6"/><polygon points="565,229 585,229 575,247" fill="#ff9a3d"/><rect x="380" y="246" width="390" height="90" rx="14" fill="#286ca0"/><text x="575" y="284" fill="white" font-size="25" font-family="DejaVu Sans" text-anchor="middle">HIGH COURTS</text><text x="575" y="314" fill="white" font-size="16" font-family="DejaVu Sans" text-anchor="middle">Articles 226, 227, 235</text><path d="M575 336 V390" stroke="#ff9a3d" stroke-width="6"/><polygon points="565,378 585,378 575,397" fill="#ff9a3d"/><rect x="155" y="398" width="365" height="100" rx="14" fill="#cce6f5" stroke="#286ca0" stroke-width="3"/><text x="337" y="436" font-size="22" font-family="DejaVu Sans" text-anchor="middle" fill="#173a60">DISTRICT &amp; TRIAL COURTS</text><text x="337" y="469" font-size="17" font-family="DejaVu Sans" text-anchor="middle" fill="#173a60">Trials, evidence, execution</text><rect x="635" y="398" width="365" height="100" rx="14" fill="#fce7ce" stroke="#c47827" stroke-width="3"/><text x="817" y="436" font-size="23" font-family="DejaVu Sans" text-anchor="middle" fill="#704315">TRIBUNALS</text><text x="817" y="469" font-size="17" font-family="DejaVu Sans" text-anchor="middle" fill="#704315">Specialised first forums</text><path d="M575 392 H337 V398 M575 392 H817 V398" stroke="#5e839e" stroke-width="4" fill="none"/><path d="M817 398 V365 H774" stroke="#b75b20" stroke-width="4" fill="none" stroke-dasharray="10,8"/><text x="830" y="359" font-size="15" font-family="DejaVu Sans" fill="#704315">HC review preserved</text><rect x="80" y="545" width="990" height="67" rx="10" fill="#e5ecf4"/><text x="575" y="571" font-size="18" font-family="DejaVu Sans" text-anchor="middle" fill="#183957">Routes depend on statute and jurisdiction; arrows are conceptual, not automatic appeals.</text><text x="575" y="596" font-size="16" font-family="DejaVu Sans" text-anchor="middle" fill="#183957">Key doctrine: L. Chandra Kumar (1997) — tribunals do not displace constitutional review.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><rect width="1100" height="600" fill="#f6f9fc"/><text x="48" y="55" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#15334f">Citizen service: from application to lawful remedy</text><text x="48" y="86" font-family="DejaVu Sans" font-size="15" fill="#536b7e">A digital front end does not replace competent departmental decisions</text><g font-family="DejaVu Sans" text-anchor="middle"><rect x="60" y="132" width="255" height="104" rx="13" fill="#1a5b86"/><text x="188" y="170" font-size="19" font-weight="bold" fill="white">Application</text><text x="188" y="199" font-size="14" fill="white">Web · mobile · assisted centre</text><rect x="423" y="132" width="255" height="104" rx="13" fill="#1c7580"/><text x="551" y="170" font-size="19" font-weight="bold" fill="white">Verification</text><text x="551" y="199" font-size="14" fill="white">Authorized department</text><rect x="785" y="132" width="255" height="104" rx="13" fill="#25714d"/><text x="913" y="170" font-size="19" font-weight="bold" fill="white">Reasoned decision</text><text x="913" y="199" font-size="14" fill="white">Approve / reject + reasons</text><rect x="785" y="335" width="255" height="112" rx="13" fill="#f6e3d2" stroke="#d08c54" stroke-width="2"/><text x="913" y="373" font-size="19" font-weight="bold" fill="#884b1c">Correction / appeal</text><text x="913" y="402" font-size="14" fill="#884b1c">Human review · clear deadline</text><rect x="422" y="335" width="256" height="112" rx="13" fill="#e3eafa" stroke="#91a4d5" stroke-width="2"/><text x="550" y="373" font-size="19" font-weight="bold" fill="#29487d">Quality monitoring</text><text x="550" y="402" font-size="14" fill="#29487d">Time · errors · access</text><rect x="60" y="335" width="255" height="112" rx="13" fill="#e6f4ea" stroke="#8fba9c" stroke-width="2"/><text x="188" y="373" font-size="19" font-weight="bold" fill="#27613b">Public outcome</text><text x="188" y="402" font-size="14" fill="#27613b">Correct, fair, accessible</text></g><g stroke="#567287" stroke-width="4" fill="none"><path d="M315 183 H413"/><path d="M678 183 H775"/><path d="M913 236 V325"/><path d="M785 392 H688"/><path d="M422 392 H325"/><path d="M188 335 V246" stroke-dasharray="8 7"/></g><g fill="#567287"><path d="M413 183 l-12 -8 v16 z"/><path d="M775 183 l-12 -8 v16 z"/><path d="M913 325 l-8 -12 h16 z"/><path d="M688 392 l12 -8 v16 z"/><path d="M325 392 l12 -8 v16 z"/><path d="M188 246 l-8 12 h16 z"/></g><text x="55" y="522" font-family="DejaVu Sans" font-size="15" fill="#526b80">Control points: lawful purpose · minimal data · audit logs · disability access · transparent fees</text><text x="55" y="551" font-family="DejaVu Sans" font-size="15" fill="#526b80">The appeal loop is mandatory for fair outcomes, even when processing is automated.</text></svg>
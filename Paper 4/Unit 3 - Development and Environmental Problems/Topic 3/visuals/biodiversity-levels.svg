<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><rect width="1200" height="400" fill="#f7fafc"/><text x="600" y="52" font-family="DejaVu Sans" font-weight="bold" font-size="29" text-anchor="middle" fill="#12304b">Three nested biodiversity levels</text><rect x="35" y="92" width="260" height="158" rx="15" fill="#e5f2ef" stroke="#1c756b" stroke-width="3"/><text x="165" y="142" font-family="DejaVu Sans" font-weight="bold" font-size="19" text-anchor="middle" fill="#12304b">GENETIC</text><text x="165" y="183" font-family="DejaVu Sans" font-size="14" text-anchor="middle" fill="#314b61">Variation within species</text><path d="M297,171 L322,171" stroke="#d3783b" stroke-width="5"/><path d="M322,171 l-10,-8 v16 z" fill="#d3783b"/><rect x="329" y="92" width="260" height="158" rx="15" fill="#e5f2ef" stroke="#1c756b" stroke-width="3"/><text x="459" y="142" font-family="DejaVu Sans" font-weight="bold" font-size="19" text-anchor="middle" fill="#12304b">SPECIES</text><text x="459" y="183" font-family="DejaVu Sans" font-size="14" text-anchor="middle" fill="#314b61">Richness and evenness</text><path d="M591,171 L616,171" stroke="#d3783b" stroke-width="5"/><path d="M616,171 l-10,-8 v16 z" fill="#d3783b"/><rect x="623" y="92" width="260" height="158" rx="15" fill="#e5f2ef" stroke="#1c756b" stroke-width="3"/><text x="753" y="142" font-family="DejaVu Sans" font-weight="bold" font-size="19" text-anchor="middle" fill="#12304b">ECOSYSTEM</text><text x="753" y="183" font-family="DejaVu Sans" font-size="14" text-anchor="middle" fill="#314b61">Habitats and processes</text><path d="M885,171 L910,171" stroke="#d3783b" stroke-width="5"/><path d="M910,171 l-10,-8 v16 z" fill="#d3783b"/><rect x="917" y="92" width="260" height="158" rx="15" fill="#e5f2ef" stroke="#1c756b" stroke-width="3"/><text x="1047" y="142" font-family="DejaVu Sans" font-weight="bold" font-size="19" text-anchor="middle" fill="#12304b">LANDSCAPE</text><text x="1047" y="183" font-family="DejaVu Sans" font-size="14" text-anchor="middle" fill="#314b61">Connectivity and turnover</text><text x="600" y="305" font-family="DejaVu Sans" font-size="19" text-anchor="middle" fill="#314b61">Alpha: within habitat   •   Beta: between habitats</text><text x="600" y="343" font-family="DejaVu Sans" font-size="19" text-anchor="middle" fill="#314b61">Gamma: diversity across the region</text></svg>
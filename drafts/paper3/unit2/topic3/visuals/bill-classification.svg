<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-label="Bill classification and legislative procedure"><style>text{font-family:Arial,sans-serif;fill:#132742}.title{font-size:24px;font-weight:700}.sub{font-size:16px}.box{fill:#edf4f8;stroke:#9cb5c8;stroke-width:2}.accent{fill:#fff3e8;stroke:#d96a21;stroke-width:2}.line{stroke:#d96a21;stroke-width:4}</style><text x="30" y="35" class="title">BILL CLASSIFICATION: PROCEDURAL GATES</text><rect x="195" y="65" width="720" height="85" rx="12" class="box"/><text x="218" y="101" class="title">Does the bill contain ONLY listed money matters?</text><text x="218" y="128" class="sub">Union: Article 110  •  State: Article 199</text><path d="M350 150L260 205M750 150L845 205" class="line"/><text x="210" y="188" class="sub">YES</text><text x="840" y="188" class="sub">NO</text><rect x="25" y="208" width="510" height="125" rx="12" class="accent"/><text x="48" y="244" class="title">MONEY BILL</text><text x="48" y="275" class="sub">Lower House introduction</text><text x="48" y="300" class="sub">Upper House: 14-day recommendations</text><rect x="565" y="208" width="510" height="125" rx="12" class="box"/><text x="588" y="244" class="title">ORDINARY / FINANCIAL BILL</text><text x="588" y="275" class="sub">Apply Article 117 or state equivalents</text><text x="588" y="300" class="sub">Upper House may retain fuller powers</text><rect x="230" y="365" width="650" height="82" rx="12" class="box"/><text x="250" y="395" class="title">CONSTITUTIONAL AMENDMENT: ARTICLE 368</text><text x="250" y="424" class="sub">Separate special majorities; no joint sitting</text></svg>